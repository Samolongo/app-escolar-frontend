<section class="login-new">
  <div class="login-container">
    <!-- Section Left: Form -->
    <div class="login-form-section">
      <div class="login-brand">
        <img src="/assets/images/escudoB.png" alt="Logo BUAP" class="logo-buap">
        <span class="brand-title">Sistema Escolar</span>
      </div>
      <h2 class="login-title">Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa tus datos de registro</p>
      <!-- Formulario de Inicio de Sesión -->
      <form (ngsubmit)="login()" class="login-form" #form="ngForm">
        <!-- Se agregan los inputs para el correo y la contraseña, con validaciones de angular -->
        <!-- Campo para correo electrónico -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" [(ngModel)]="username" name="username" class="form-control" id="email" placeholder="nombre@buap.edu.mx" autocomplete="username">
          @if (errors.username) {
            <div class="invalid-feedback">{{errors.username}}</div>
          }
        </div>
        <!-- Campo para contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div style="position:relative">
            <input [type]="type" [(ngModel)]="password" id="password" name="password_user" class="form-control-pwd"
              placeholder="Mínimo 8 caracteres" autocomplete="current-password" (keyup.enter)="login()">
          </div>
        </div>
        <!-- Botón de inicio de sesión -->
        <button type="submit" class="btn-login" [disabled]="load">Iniciar Sesión</button>
        <div class="form-register">
          ¿No tienes cuenta? <a (click)="">Regístrate</a>
        </div>
      </form>
    </div>
  </div>
</section>
